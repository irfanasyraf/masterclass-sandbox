apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: openshift4-community
  namespace: openshift-gitops
spec:
  description: "Open community GitOps project for shared OpenShift enablement assets"

  sourceRepos:
    # Main cluster configuration repo
    - https://github.com/irfanasyraf/masterclass-sandbox.git

  destinations:
    - server: https://kubernetes.default.svc
      namespace: "*"

  # Allow cluster-scoped + namespaced resources.
  # Tighten these per-namespace once the cluster is stable.
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"

  # Prevent accidental deletion of the project while Applications exist
  orphanedResources:
    warn: true
