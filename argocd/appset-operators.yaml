# ==============================================================================
# ApplicationSet: openshift4-operators
#
# Manages the two-layer OLM operator installation as separate ArgoCD Applications:
#
#   operators-layer1  (sync-wave 1) — Namespaces, OperatorGroups, Subscriptions
#   operators-layer2  (sync-wave 2) — Operands / Custom Resources
#
# Sync-wave ordering ensures layer1 (operators) reaches healthy state before
# layer2 (operands) attempts to create CRs that depend on the operator CRDs.
#
# ==============================================================================
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: openshift4-operators
  namespace: openshift-gitops
spec:
  syncPolicy:
    preserveResourcesOnDeletion: false

  generators:
    - list:
        elements:
          # ------------------------------------------------------------------
          # Layer 1: Namespaces + OperatorGroups + Subscriptions
          # ------------------------------------------------------------------
          - name: operators-layer1
            path: operators/layer1-install
            wave: "1"
            destNamespace: openshift-operators-helm

          # ------------------------------------------------------------------
          # Layer 2: Operands (CRs)
          # ------------------------------------------------------------------
          - name: operators-layer2
            path: operators/layer2-operands
            wave: "2"
            destNamespace: openshift-operators-helm

  template:
    metadata:
      name: "{{name}}"
      namespace: openshift-gitops
      annotations:
        argocd.argoproj.io/sync-wave: "{{wave}}"
    spec:
      project: openshift4-community

      source:
        repoURL: https://github.com/irfanasyraf/masterclass-sandbox.git
        targetRevision: feat/irfan-init
        path: "{{path}}"
        helm:
          valueFiles:
            - values.yaml

      destination:
        server: https://kubernetes.default.svc
        namespace: "{{destNamespace}}"

      syncPolicy:
        automated:
          prune: false       # never auto-delete operator namespaces or CRDs
          selfHeal: true
        allowEmpty: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true          # required for large ArgoCD / operator CRs
          - RespectIgnoreDifferences=true
          - ApplyOutOfSyncOnly=true
          # ------------------------------------------------------------------
          # SkipDryRunOnMissingResource=true — DO NOT REMOVE.
          #
          # Before running any sync task, ArgoCD resolves every rendered
          # resource's GVK against the cluster's discovery API. If even ONE kind
          # is unknown, gitops-engine fails the whole operation with
          # "one or more synchronization tasks are not valid" and applies
          # NOTHING. The failure is atomic, not per-resource.
          #
          # That is fatal for this repo, because layer2 is nothing but custom
          # resources whose CRDs are installed by layer1 operators — and, worse,
          # a few whose CRDs are installed by a layer2 operand:
          #
          #   DataScienceCluster (wave 0, this app)
          #     └─ kserve.modelsAsService: Managed
          #          └─ installs maas.opendatahub.io CRDs
          #               └─ Tenant / MaaSSubscription / MaaSAuthPolicy (waves 3-4, this app)
          #     └─ dashboard component
          #          └─ installs opendatahub.io/OdhDashboardConfig
          #               └─ OdhDashboardConfig (wave 4, this app)
          #
          # Without this option that is a hard deadlock: the DSC can never be
          # created, because the sync that would create it is rejected up front
          # over CRs that only exist once the DSC has run. Observed on
          # cluster-dgs2z 2026-08-06 — every operator installed, zero operands.
          #
          # With it, unknown kinds are marked skipDryRun instead of invalidating
          # the sync. They still fail at apply time while the CRD is absent, but
          # everything else applies, and the retry below converges once the CRDs
          # appear. Sync waves alone do NOT save you here: ArgoCD has no health
          # check for DataScienceCluster, so it is considered Healthy the moment
          # it is created and later waves start immediately.
          #
          # IMPORTANT — this app-level entry is NOT sufficient on its own.
          # Tested on OpenShift GitOps 1.21.1 (cluster-dgs2z, 2026-08-06): with
          # only this option set, the sync still failed with 0 resources synced.
          # The option is honoured per-resource, via
          #   argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
          # on the object itself. Those annotations are the actual fix and live
          # in:
          #   operators/layer2-operands/templates/maas-tenant.yaml
          #   operators/layer2-operands/templates/rhods-dashboard-config.yaml
          #   bases/model-serving/kustomization.yaml  (commonAnnotations)
          # This entry is kept as belt-and-braces for ArgoCD versions that do
          # respect it, but do not rely on it alone.
          # ------------------------------------------------------------------
          - SkipDryRunOnMissingResource=true
        retry:
          # Sized for a cold bootstrap: RHOAI needs ~10-15 min to install its
          # operator, reconcile the DSC and register the MaaS/KServe CRDs, and
          # nothing here is `automated`, so if retries run out the app just sits
          # Failed until someone syncs it by hand.
          # 30s + 60s + 120s + 180s x7 ≈ 24 min of retrying.
          limit: 10
          backoff:
            duration: 30s
            factor: 2
            maxDuration: 3m

      # Ignore fields that operators / OCP manage themselves after creation
      ignoreDifferences:
        # OLM updates status and adds annotations after subscription creation
        - group: operators.coreos.com
          kind: Subscription
          jsonPointers:
            - /status
        - group: operators.coreos.com
          kind: OperatorGroup
          jsonPointers:
            - /metadata/annotations/olm.providedAPIs
        # ArgoCD CR is owned by the GitOps operator — ownerRef changes are expected
        - group: argoproj.io
          kind: ArgoCD
          jsonPointers:
            - /status
            - /metadata/ownerReferences
        # HCO operator defaults and reconciles most spec fields (certConfig,
        # featureGates, etc.) and status after HyperConverged creation
        - group: hco.kubevirt.io
          kind: HyperConverged
          jsonPointers:
            - /status
        # RHACS operator manages status after Central creation
        - group: platform.stackrox.io
          kind: Central
          jsonPointers:
            - /status
        - group: platform.stackrox.io
          kind: SecuredCluster
          jsonPointers:
            - /status
        # LokiStack S3 secret — placeholder is committed; real values are set manually.
        # Ignore data so ArgoCD never overwrites credentials after they are entered.
        - group: ""
          kind: Secret
          name: logging-loki-s3
          namespace: openshift-logging
          jsonPointers:
            - /data
        - group: ""
          kind: Secret
          name: netobserv-loki-s3
          namespace: netobserv
          jsonPointers:
            - /data
        # Workshop HTPasswd secret — placeholder (empty) is committed; real user
        # hashes are set manually via `oc edit`/`oc apply`, never committed to git.
        - group: ""
          kind: Secret
          name: workshop-htpasswd
          namespace: openshift-config
          jsonPointers:
            - /data
        # Grafana datasource bearer token is injected by the grafana-auth-job sync hook.
        # Ignore secureJsonData so ArgoCD does not reset it to empty on each sync.
        - group: grafana.integreatly.org
          kind: GrafanaDatasource
          jsonPointers:
            - /spec/datasource/secureJsonData
        # MaaS metrics DB + Grafana Postgres credentials — placeholders are
        # committed; real passwords are set manually.
        - group: ""
          kind: Secret
          name: maas-postgres
          namespace: redhat-ods-applications
          jsonPointers:
            - /data
        - group: ""
          kind: Secret
          name: maas-postgres-grafana-auth
          namespace: grafana
          jsonPointers:
            - /data
        # maas-db-config holds DB_CONNECTION_URL with the same password embedded
        # in it — placeholder committed, real value set manually.
        - group: ""
          kind: Secret
          name: maas-db-config
          namespace: redhat-ods-applications
          jsonPointers:
            - /data
        # thanos-querier-serving-ca is committed empty; service-ca-operator
        # injects service-ca.crt into it (techdebt.md #4). Ignore data so ArgoCD
        # does not keep blanking it back out.
        - group: ""
          kind: ConfigMap
          name: thanos-querier-serving-ca
          namespace: redhat-ods-monitoring
          jsonPointers:
            - /data
        # cluster-monitoring-config is shared with OCP (retention, storage,
        # alertmanager). We ServerSideApply only enableUserWorkload into it, so
        # ignore any other keys the cluster or an admin adds.
        - group: ""
          kind: ConfigMap
          name: cluster-monitoring-config
          namespace: openshift-monitoring
          jsonPointers:
            - /data
        # RHOAI owns OdhDashboardConfig; we patch a subset of fields via
        # ServerSideApply and let the operator manage the rest.
        - group: opendatahub.io
          kind: OdhDashboardConfig
          jsonPointers:
            - /status
        # NVIDIA ClusterPolicy was parked here (ignoring /spec) while the policy
        # was tuned by hand on-cluster. The tested spec now lives in
        # operators/layer2-operands/values.yaml, so git is authoritative again
        # and only /status is ignored.
        - group: nvidia.com
          kind: ClusterPolicy
          jsonPointers:
            - /status
        # MaaS/KServe/Kuadrant operands are heavily status-driven.
        - group: maas.opendatahub.io
          kind: MaaSSubscription
          jsonPointers:
            - /status
        - group: kuadrant.io
          kind: Kuadrant
          jsonPointers:
            - /status
        - group: gateway.networking.k8s.io
          kind: Gateway
          jsonPointers:
            - /status