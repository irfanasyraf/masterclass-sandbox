# ==============================================================================
# ApplicationSet: openshift4-workloads
#
# Uses ArgoCD's Git directory generator to automatically discover every
# subdirectory under overlay/my-sno-cluster/ and create a separate ArgoCD
# Application for each one.
#
# This replaces the old single "my-sno-cluster" Application that lumped
# everything together. Now each component (grafana, gatus, kyverno, …)
# appears as its own Application in the ArgoCD UI.
#
# Adding a new workload:
#   1. Create  overlay/my-sno-cluster/<name>/kustomization.yaml
#   2. Push to main — ArgoCD auto-discovers and creates the Application.
#      No changes to this file required.
#
# Sync-wave 3 ensures workloads deploy after operators (waves 1 & 2).
# ==============================================================================
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: openshift4-workloads
  namespace: openshift-gitops
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error

  generators:
    - git:
        repoURL: https://github.com/irfanasyraf/masterclass-sandbox.git
        revision: main
        directories:
          # Each subdirectory here becomes one ArgoCD Application.
          # Add new workloads by creating overlay/my-sno-cluster/<name>/kustomization.yaml
          - path: overlay/my-sno-cluster/*
          # To disable a workload without deleting the folder, add it here with exclude: true
          - path: overlay/my-sno-cluster/kyverno
            exclude: true
        # template:
        #   metadata:
        #     annotations:
        #       exclude: "true"

  template:
    metadata:
      name: "{{ .path.basename }}"
      namespace: openshift-gitops
      annotations:
        argocd.argoproj.io/sync-wave: "3"
    spec:
      project: openshift4-community

      source:
        repoURL: https://github.com/irfanasyraf/masterclass-sandbox.git
        targetRevision: feat/dl-init
        path: "{{ .path.path }}"
        # ArgoCD auto-detects kustomize (kustomization.yaml present)
        # or Helm (Chart.yaml present) — no explicit config needed

      destination:
        server: https://kubernetes.default.svc
        # Individual kustomization.yaml files set their own namespace via
        # the 'namespace:' field; this is a fallback default.
        namespace: default

      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        allowEmpty: true
        syncOptions:
          - CreateNamespace=true
          - ApplyOutOfSyncOnly=true
          - RespectIgnoreDifferences=true

      ignoreDifferences:
        - group: ""
          kind: ConfigMap
          name: gatus-config
          namespace: gatus
          jsonPointers:
            - /data

        # --- get-a-username ----------------------------------------------
        # Workshop user/admin passwords + access token. Placeholders in git;
        # real values set with `oc edit secret get-a-username-secret -n guides`.
        - group: ""
          kind: Secret
          name: get-a-username-secret
          namespace: guides
          jsonPointers:
            - /data
        - group: ""
          kind: Secret
          name: redis
          namespace: guides
          jsonPointers:
            - /data
        - group: ""
          kind: Secret
          name: ctfd-secrets
          namespace: ctfd
          jsonPointers:
            - /data